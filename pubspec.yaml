name: rubric
description: Rubric — build weighted grading rubrics, grade whole classes fast, and see how every objective is landing.
publish_to: 'none'
version: 2.0.0+20

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  collection: ^1.19.1
  csv: ^8.0.0
  dotted_border: ^3.1.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  font_awesome_flutter: ^11.0.0
  go_router: ^18.0.2
  # Keeps content clear of the system bars, the keyboard and our own docked
  # CTA and nav bar, by measurement (no inset arithmetic). Owner in
  # #harbor_owner (github.com/SupposedlySam/harbor).
  harbor: ^0.4.0
  intl: ^0.20.3
  meta: ^1.19.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  revali_client: ^3.0.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  zonai_client: ^0.3.1
  # Offline sync. Released with zonai v0.10.0 but not yet on pub.dev
  # (publish_to: none), so pinned to the release tag. Move to hosted
  # versions once published.
  zonai_sync:
    git:
      url: https://github.com/mrgnhnt96/zonai.git
      ref: v0.10.0
      path: libs/zonai_sync
  zonai_sync_drift:
    git:
      url: https://github.com/mrgnhnt96/zonai.git
      ref: v0.10.0
      path: libs/zonai_sync_drift

dev_dependencies:
  app_deploy_screenshots: ^1.2.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  harbor_test: ^0.2.2
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Avenir-Black
      fonts:
        - asset: assets/custom_fonts/Avenir-Black.ttf
          weight: 900
    - family: Avenir-Heavy
      fonts:
        - asset: assets/custom_fonts/Avenir-Heavy.ttf
          weight: 800
    - family: Avenir-Light
      fonts:
        - asset: assets/custom_fonts/Avenir-Light.ttf
          weight: 100

  assets:
    - assets/images/

dependency_overrides:
  # zonai_sync_drift depends on zonai_sync as a hosted package (it is resolved
  # inside the zonai workspace); outside it, point that at the same git ref.
  zonai_sync:
    git:
      url: https://github.com/mrgnhnt96/zonai.git
      ref: v0.10.0
      path: libs/zonai_sync

