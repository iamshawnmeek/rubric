name: rubric
description: Rubric — build weighted grading rubrics, grade whole classes fast, and see how every objective is landing.
publish_to: 'none'
version: 2.0.0+20

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  collection: ^1.19.1
  csv: ^8.0.0
  dotted_border: ^3.1.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  font_awesome_flutter: ^11.0.0
  go_router: ^18.0.2
  intl: ^0.20.3
  meta: ^1.19.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Avenir-Black
      fonts:
        - asset: assets/custom_fonts/Avenir-Black.ttf
          weight: 900
    - family: Avenir-Heavy
      fonts:
        - asset: assets/custom_fonts/Avenir-Heavy.ttf
          weight: 800
    - family: Avenir-Light
      fonts:
        - asset: assets/custom_fonts/Avenir-Light.ttf
          weight: 100

  assets:
    - assets/images/
